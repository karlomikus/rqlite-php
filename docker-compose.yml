services:
  php:
    build: .
    working_dir: /app
    volumes:
      - ./:/app

  myrqlite-service-1:
    image: rqlite/rqlite:latest
    hostname: myrqlite-host-1
    ports:
      - "4001:4001"
      - "4002:4002"
    environment:
      NODE_ID: myrqlite-node-1
      HTTP_ADDR: myrqlite-host-1:4001
      RAFT_ADDR: myrqlite-host-1:4002
      SQLITE_EXTENSIONS: "sqlean,sqlite-vec,misc"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://myrqlite-host-1:4001/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  myrqlite-service-2:
    image: rqlite/rqlite:latest
    hostname: myrqlite-host-2
    ports:
      - "4011:4001"
      - "4012:4002"
    command: -join myrqlite-service-1:4002
    environment:
      NODE_ID: myrqlite-node-2
      HTTP_ADDR: myrqlite-host-2:4001
      RAFT_ADDR: myrqlite-host-2:4002
      SQLITE_EXTENSIONS: "sqlean,sqlite-vec,misc"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://myrqlite-host-2:4001/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      myrqlite-service-1:
        condition: service_healthy

  myrqlite-service-3:
    image: rqlite/rqlite:latest
    hostname: myrqlite-host-3
    ports:
      - "4021:4001"
      - "4022:4002"
    command: -join myrqlite-service-1:4002
    environment:
      NODE_ID: myrqlite-node-3
      HTTP_ADDR: myrqlite-host-3:4001
      RAFT_ADDR: myrqlite-host-3:4002
      SQLITE_EXTENSIONS: "sqlean,sqlite-vec,misc"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://myrqlite-host-3:4001/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      myrqlite-service-1:
        condition: service_healthy
